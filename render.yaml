services:
  - type: web
    name: atlas-audit-platform
    runtime: python
    buildCommand: pip install -r requirements.txt && python generate_data.py
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.6
